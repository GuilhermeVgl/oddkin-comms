      responses:
        "200":
          description: Trust root
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustRoot"
        "401":
          description: No active session
        "404":
          description: Not configured yet
    put:
      operationId: setTrustRoot
      summary: Pin the trust root once (organization administrators)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTrustRootRequest"
      responses:
        "200":
          description: Trust root pinned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustRoot"
        "400":
          description: Invalid key
        "401":
          description: No active session
        "403":
          description: Origin, CSRF token, or role rejected
        "409":
          description: Already configured
  /api/v1/devices:
    get:
