          description: API is ready to serve requests
        "503":
          description: A required dependency is unavailable
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    KeyDomainId:
      name: keyDomainId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CallId:
      name: callId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UploadId:
      name: uploadId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SprintId:
      name: sprintId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkItemId:
      name: workItemId
      in: path
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: crewstead_session
  schemas:
    OrganizationBranding:
      type: object
      required: [name, hasLogo, showDuo]
      additionalProperties: false
      properties:
        name: { type: string, description: Empty until initial team setup }
        hasLogo: { type: boolean }
        showDuo: { type: boolean }
    UpdateOrganizationBrandingRequest:
      type: object
      required: [name, showDuo]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        showDuo: { type: boolean }
        logoBase64:
          { type: string, description: Optional base64 image, at most 1 MiB }
        logoMime: { type: string, enum: [image/png, image/jpeg, image/webp] }
        removeLogo: { type: boolean }
    AcceptInvitationRequest:
      type: object
      required: [token, email]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 1024
    CreateInvitationRequest:
      type: object
      required: [email, membershipKind]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        membershipKind:
          type: string
          enum: [internal, external]
    Invitation:
      type: object
      required: [id, email, membershipKind, expiresAt, deliveryState]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        membershipKind:
          type: string
          enum: [internal, external]
        expiresAt:
          type: string
          format: date-time
        deliveryState:
          type: string
          enum: [pending]
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 1024
    CurrentAccount:
      type: object
      required: [id, email, membershipKind, isAdmin]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        membershipKind:
          type: string
          enum: [internal, external]
        isAdmin:
          type: boolean
    Project:
      type: object
      required:
        [
          id,
          name,
          description,
          color,
          icon,
          version,
          isManager,
          encrypted,
          contentRevision,
          permissions,
        ]
      additionalProperties: false
      properties:
        archived: { type: boolean }
        nameEnc: { $ref: "#/components/schemas/EncryptedBlob" }
        descriptionEnc: { $ref: "#/components/schemas/EncryptedBlob" }
        signerDeviceId: { type: string, format: uuid }
        encrypted: { type: boolean }
        contentRevision: { type: integer }
        contentAuthorId: { type: string, format: uuid }
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        color: { type: string }
        icon: { type: string }
        version: { type: integer }
        isManager: { type: boolean }
        permissions:
          type: array
          description: What the caller may do in this project; the server enforces it regardless
          items: { type: string }
    CreateProjectRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        color: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
    ProjectMember:
      type: object
      required: [accountId, email, membershipKind, isManager]
      additionalProperties: false
      properties:
        accountId: { type: string, format: uuid }
        email: { type: string, format: email }
        membershipKind: { type: string, enum: [internal, external] }
        isManager: { type: boolean }
    AddProjectMemberRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        isManager: { type: boolean }
    ExternalPolicy:
      type: object
      required: [permissions, version]
      additionalProperties: false
      properties:
        permissions:
          type: array
          items: { $ref: "#/components/schemas/ExternalPermission" }
        version: { type: integer }
    UpdateExternalPolicyRequest:
      type: object
      required: [permissions, version]
      additionalProperties: false
      properties:
        permissions:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/ExternalPermission" }
        version: { type: integer }
    ExternalPermission:
      type: string
      enum:
        [
          work.read,
          work.create,
          work.edit,
          work.move,
          work.archive,
          work.comment,
          planning.edit,
          chat.read,
          chat.send,
