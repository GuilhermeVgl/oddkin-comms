            required: [recipientDeviceId, sealed, signature]
            additionalProperties: false
            properties:
              recipientDeviceId: { type: string, format: uuid }
              sealed: { $ref: "#/components/schemas/Base64Url" }
              signature: { $ref: "#/components/schemas/Base64Url" }
    KeyEnvelope:
      type: object
      required:
        [generation, recipientDeviceId, signerDeviceId, sealed, signature]
      additionalProperties: false
      properties:
        generation: { type: integer }
        recipientDeviceId: { type: string, format: uuid }
        signerDeviceId: { type: string, format: uuid }
        sealed: { $ref: "#/components/schemas/Base64Url" }
        signature: { $ref: "#/components/schemas/Base64Url" }
    EncryptedBlob:
      type: string
      description: Unpadded base64url of a content envelope (header, ciphertext and signature)
      maxLength: 400000
    ApiError:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            [
              encryption_required,
              stale_generation,
              rotation_required,
              domain_unavailable,
              bad_revision,
              bad_envelope,
              id_required,
            ]
    KeyRecipient:
      type: object
      required: [generation, deviceId]
      additionalProperties: false
      properties:
        generation: { type: integer }
        deviceId: { type: string, format: uuid }
    GrantEnvelopesRequest:
      type: object
      required: [generation, signerDeviceId, envelopes]
      additionalProperties: false
      properties:
        generation: { type: integer, minimum: 1 }
        signerDeviceId: { type: string, format: uuid }
        envelopes:
          type: array
          maxItems: 500
          items:
            type: object
            required: [recipientDeviceId, sealed, signature]
            additionalProperties: false
            properties:
              recipientDeviceId: { type: string, format: uuid }
              sealed: { $ref: "#/components/schemas/Base64Url" }
              signature: { $ref: "#/components/schemas/Base64Url" }
    EncryptCommentRequest:
      type: object
      required: [bodyEnc, signerDeviceId]
      additionalProperties: false
      properties:
        bodyEnc: { $ref: "#/components/schemas/EncryptedBlob" }
        signerDeviceId: { type: string, format: uuid }
    UpdateProjectRequest:
      type: object
      required: [nameEnc, descriptionEnc, signerDeviceId, contentRevision]
      additionalProperties: false
      properties:
        nameEnc: { $ref: "#/components/schemas/EncryptedBlob" }
        descriptionEnc: { $ref: "#/components/schemas/EncryptedBlob" }
        signerDeviceId: { type: string, format: uuid }
        contentRevision: { type: integer }
    UpdateConversationRequest:
      type: object
      required: [nameEnc, signerDeviceId, contentRevision]
      additionalProperties: false
      properties:
        nameEnc: { $ref: "#/components/schemas/EncryptedBlob" }
        signerDeviceId: { type: string, format: uuid }
        contentRevision: { type: integer }
    UpdateSprintRequest:
      type: object
      required: [nameEnc, goalEnc, signerDeviceId, contentRevision]
      additionalProperties: false
      properties:
        nameEnc: { $ref: "#/components/schemas/EncryptedBlob" }
        goalEnc: { $ref: "#/components/schemas/EncryptedBlob" }
        signerDeviceId: { type: string, format: uuid }
        contentRevision: { type: integer }
    RecoveryGap:
      type: object
      required: [domainId, kind, generation, device]
      additionalProperties: false
      properties:
        domainId: { type: string, format: uuid }
        kind: { type: string, enum: [work, chat, files, dm, sprint] }
        projectId: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        generation: { type: integer }
        device: { $ref: "#/components/schemas/DirectoryDevice" }
    RecoveryAuditEntry:
      type: object
      required:
        [id, createdAt, generation, domainKind, approverEmail, recipientEmail]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        generation: { type: integer }
