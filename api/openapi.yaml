openapi: 3.0.3
info:
  title: Crewstead API
  version: 0.1.0
  description: Operational and account session endpoints.
paths:
  /api/v1/organization/branding:
    get:
      operationId: getOrganizationBranding
      summary: Team identity for signed-in members
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Team identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationBranding"
        "401":
          description: No active session
    patch:
      operationId: updateOrganizationBranding
      summary: Configure the team identity (administrator)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationBrandingRequest"
      responses:
        "200":
          description: Updated team identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationBranding"
        "400":
          description: Invalid name or image
        "401":
          description: No active session
        "403":
          description: Not an administrator or invalid CSRF token
  /api/v1/organization/logo:
    get:
      operationId: getOrganizationLogo
      summary: Team logo for signed-in members
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Image bytes
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "401":
          description: No active session
        "404":
          description: No logo configured
  /api/v1/invitations:
    post:
      operationId: createInvitation
      summary: Invite a person to the organization
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitation persisted and queued for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          description: Invalid request
        "401":
          description: No active session
        "403":
          description: Origin, CSRF token, or role rejected
        "503":
          description: Invitation service temporarily unavailable
  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an organization invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "204":
          description: Invitation accepted
        "400":
          description: Invalid, expired, used, or mismatched invitation
        "403":
          description: Origin rejected
        "503":
          description: Invitation service temporarily unavailable
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Create an account session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "204":
          description: Session and CSRF cookies were set
        "400":
          description: Invalid request
        "401":
          description: Invalid credentials
        "403":
          description: Origin rejected
        "429":
          description: Too many attempts
        "503":
          description: Login temporarily unavailable
  /api/v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: Ask for a password reset link; the answer is the same for every e-mail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: Accepted. A link is sent only when an account exists.
        "400":
          description: Invalid request
        "403":
          description: Origin rejected
        "429":
          description: Too many attempts
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Set a new password with a single-use token; ends every earlier session and restores no encrypted history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "204":
          description: Password changed
        "400":
          description: Invalid request or weak password
        "403":
          description: Origin rejected
        "404":
          description: The token is invalid, used or expired
        "429":
          description: Too many attempts
  /api/v1/sessions:
    get:
      operationId: listSessions
      summary: The caller's active sessions
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthSession"
        "401":
          description: No active session
  /api/v1/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeSession
      summary: End one of the caller's sessions, current or not
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Revoked
        "401":
          description: No active session
        "403":
          description: Origin or CSRF token rejected
        "404":
          description: Unknown session
  /api/v1/organization/people:
    get:
      operationId: listOrganizationPeople
      summary: Everyone in the organization (administrators)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: People
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationPerson"
        "401":
          description: No active session
        "403":
          description: Administrators only
  /api/v1/organization/people/{accountId}/active:
    parameters:
      - name: accountId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setPersonActive
      summary: Deactivate or reactivate an account; deactivating ends every session (administrators)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetActiveRequest"
      responses:
        "204":
          description: Updated
        "401":
          description: No active session
        "403":
          description: Origin, CSRF token, or role rejected
        "404":
          description: Unknown person
        "409":
          description: The last active administrator cannot be deactivated
  /api/v1/auth/me:
    get:
      operationId: getCurrentAccount
      summary: Return the authenticated account
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccount"
        "401":
          description: No active session
        "503":
          description: Session lookup temporarily unavailable
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Current session revoked
        "401":
          description: No active session
        "403":
          description: Origin or CSRF token rejected
        "503":
          description: Logout temporarily unavailable
  /api/v1/auth/logout-all:
    post:
      operationId: logoutAll
      summary: Revoke every session for the account
      security:
        - sessionCookie: []
      responses:
        "204":
          description: All sessions revoked
        "401":
          description: No active session
        "403":
          description: Origin or CSRF token rejected
        "503":
          description: Logout temporarily unavailable
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects the account belongs to; archived ones only on request
      security:
        - sessionCookie: []
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          description: No active session
    post:
      operationId: createProject
      summary: Create a project with the default board (organization administrators)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid request
        "401":
          description: No active session
        "403":
          description: Origin, CSRF token, or role rejected
  /api/v1/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      summary: Return one project the account belongs to
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          description: No active session
        "404":
          description: Unknown or inaccessible project
    patch:
      operationId: updateProject
      summary: Encrypt the project name and description (project managers)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "204":
          description: Updated; the plaintext is erased
        "400":
          description: Invalid envelope
        "401":
          description: No active session
        "403":
          description: Origin, CSRF token, or role rejected
        "404":
          description: Unknown or inaccessible resource
        "409":
          description: Revision, generation or domain state conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/projects/{projectId}/appearance:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    put:
      operationId: setProjectAppearance
      summary: Choose the project's colour (project managers)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectAppearanceRequest"
      responses:
        "204":
          description: Updated
        "400":
          description: Not a #RRGGBB colour
        "401":
          description: No active session
        "403":
          description: Origin, CSRF token, or role rejected
        "404":
          description: Unknown or inaccessible project
        "409":
          description: Project is archived
  /api/v1/projects/{projectId}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectMembers
      summary: List project members
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMember"
        "401":
          description: No active session
        "404":
          description: Unknown or inaccessible project
    post:
      operationId: addProjectMember
      summary: Add an existing organization member to the project (managers)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddProjectMemberRequest"
      responses:
        "204":
          description: Member added
        "400":
          description: Invalid request or unknown organization member
        "401":
          description: No active session
        "403":
          description: Origin, CSRF token, or role rejected
        "404":
          description: Unknown or inaccessible project
        "409":
          description: Project is archived
  /api/v1/projects/{projectId}/members/{accountId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: accountId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: removeProjectMember
      summary: Remove a member; access ends at once and the project keys are rotated (managers)
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Member removed
        "401":
          description: No active session
        "403":
          description: Origin, CSRF token, or role rejected
        "404":
          description: Unknown project, or the account is not a member
        "409":
          description: The last manager cannot be removed, or the project is archived
  /api/v1/projects/{projectId}/external-policy:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getExternalPolicy
      summary: Return the single permission profile shared by external members
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalPolicy"
        "401":
          description: No active session
        "404":
          description: Unknown or inaccessible project
    put:
      operationId: updateExternalPolicy
      summary: Replace the external permission profile (managers)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExternalPolicyRequest"
      responses:
        "200":
          description: Policy updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalPolicy"
        "400":
          description: Invalid permission set
        "401":
          description: No active session
        "403":
          description: Origin, CSRF token, or role rejected
        "404":
          description: Unknown or inaccessible project
        "409":
          description: Policy version conflict
  /api/v1/projects/{projectId}/columns:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createBoardColumn
      summary: Add a column at the end of the board (project managers)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBoardColumnRequest"
      responses:
        "201":
          description: Created column
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardColumn"
        "400":
          description: Invalid name or category
        "401":
          description: No active session
        "403":
          description: Origin, CSRF token, or role rejected
        "404":
          description: Unknown or inaccessible project
    get:
      operationId: listBoardColumns
      summary: List board columns
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Columns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BoardColumn"
        "401":
          description: No active session
        "404":
          description: Unknown or inaccessible project
  /api/v1/projects/{projectId}/columns/order:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    put:
      operationId: reorderBoardColumns
      summary: Set the order of every column (project managers)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderBoardColumnsRequest"
      responses:
        "200":
          description: Columns in their new order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BoardColumn"
        "400":
          description: The list is not exactly the project's columns
        "401":
          description: No active session
        "403":
          description: Origin, CSRF token, or role rejected
        "404":
          description: Unknown or inaccessible project
  /api/v1/projects/{projectId}/columns/{columnId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: columnId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateBoardColumn
      summary: Rename a column or change its category (project managers)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBoardColumnRequest"
      responses:
        "200":
          description: Updated column
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardColumn"
        "400":
          description: Invalid name, or the board would lose its open or done column
        "401":
          description: No active session
        "403":
          description: Origin, CSRF token, or role rejected
        "404":
          description: Unknown or inaccessible column
    delete:
      operationId: deleteBoardColumn
      summary: Delete a column, moving its activities to another one in the same transaction (project managers)
      security:
        - sessionCookie: []
      parameters:
        - name: moveTo
          in: query
          required: false
          description: Destination column; required when the column holds activities
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted
        "400":
          description: Missing or invalid destination, or the board would lose its open or done column
        "401":
          description: No active session
        "403":
          description: Origin, CSRF token, or role rejected
        "404":
          description: Unknown or inaccessible column
  /api/v1/projects/{projectId}/work-items:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listWorkItems
      summary: List non-archived tasks and subtasks
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Work items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkItem"
        "401":
          description: No active session
        "404":
          description: Unknown or inaccessible project
    post:
      operationId: createWorkItem
      summary: Create a task or subtask
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkItemRequest"
      responses:
        "201":
          description: Work item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "400":
          description: Invalid request or relation
        "401":
          description: No active session
        "403":
          description: Origin, CSRF token, or permission rejected
        "404":
          description: Unknown or inaccessible project
        "409":
          description: Project is archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/work-items/{workItemId}:
    parameters:
      - $ref: "#/components/parameters/WorkItemId"
    patch:
      operationId: updateWorkItem
      summary: Edit, move, archive or restore a work item with optimistic versioning
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkItemRequest"
      responses:
        "200":
          description: Updated work item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "400":
          description: Invalid request or relation
        "401":
          description: No active session
        "403":
          description: Origin, CSRF token, or permission rejected
        "404":
          description: Unknown or inaccessible item
        "409":
          description: Version conflict, archived project, or open subtasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/work-items/{workItemId}/followers/me:
    parameters:
      - $ref: "#/components/parameters/WorkItemId"
    get:
      operationId: getFollowing
      summary: Whether the caller follows the activity
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Following state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Following"
        "401":
          description: No active session
        "403":
          description: The profile cannot read activities
        "404":
          description: Unknown or inaccessible activity
    put:
      operationId: followWorkItem
      summary: Follow the activity; moves and comments are announced inside the app
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Following
        "401":
          description: No active session
        "403":
          description: Origin, CSRF token, or permission rejected
        "404":
          description: Unknown or inaccessible activity
    delete:
      operationId: unfollowWorkItem
      summary: Stop following the activity
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Not following
        "401":
          description: No active session
        "403":
          description: Origin or CSRF token rejected
        "404":
          description: Unknown or inaccessible activity
  /api/v1/work-items/{workItemId}/comments:
    parameters:
      - $ref: "#/components/parameters/WorkItemId"
    get:
      operationId: listWorkItemComments
      summary: List comments in chronological order
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkItemComment"
        "401":
          description: No active session
        "404":
          description: Unknown or inaccessible item
    post:
      operationId: createWorkItemComment
      summary: Add a comment
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemComment"
        "400":
          description: Invalid request
        "401":
          description: No active session
        "403":
          description: Origin, CSRF token, or permission rejected
        "404":
          description: Unknown or inaccessible item
        "409":
          description: Project is archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/projects/{projectId}/conversations:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listConversations
      summary: List the project channels
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
        "401":
          description: No active session
        "403":
          description: Profile does not allow reading chat
        "404":
          description: Unknown or inaccessible project
    post:
      operationId: createChannel
      summary: Create a channel; the name is encrypted when the project is (project managers)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          description: Invalid name
        "401":
          description: No active session
        "403":
          description: Origin, CSRF token, or role rejected
        "404":
          description: Unknown or inaccessible project
        "409":
          description: Project is archived or the encryption state does not allow this write
  /api/v1/projects/{projectId}/conversations/order:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    put:
      operationId: reorderChannels
      summary: Set the order of every channel of the project (project managers)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRequest"
      responses:
        "204":
          description: Reordered
        "400":
          description: The list must contain every channel exactly once
        "401":
          description: No active session
        "403":
          description: Origin, CSRF token, or role rejected
        "404":
          description: Unknown or inaccessible project
        "409":
          description: Project is archived
  /api/v1/conversations/{conversationId}/archive:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setChannelArchived
      summary: Archive or restore a channel; archived channels are read-only (project managers)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveRequest"
      responses:
        "204":
          description: Updated
        "401":
          description: No active session
        "403":
          description: Origin, CSRF token, or role rejected
        "404":
          description: Unknown or inaccessible channel
        "409":
          description: Project is archived
  /api/v1/projects/{projectId}/archive:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    put:
      operationId: setProjectArchived
      summary: Archive or restore a project (project managers)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveRequest"
      responses:
        "204":
          description: Updated
        "401":
          description: No active session
        "403":
          description: Origin, CSRF token, or role rejected
        "404":
          description: Unknown or inaccessible project
  /api/v1/conversations/{conversationId}/messages:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listMessages
      summary: List messages after a sequence number, oldest first
      security:
