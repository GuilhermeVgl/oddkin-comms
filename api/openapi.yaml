  /api/v1/webhooks/livekit:
    post:
      operationId: livekitWebhook
      summary: Signed LiveKit webhook used to reconcile presence
      responses:
        "204":
          description: Accepted
        "401":
          description: Missing or invalid signature
        "503":
          description: Media server not configured
  /api/v1/e2ee/trust-root:
    get:
      operationId: getTrustRoot
      summary: Public key of the organization trust root (verify its fingerprint out of band)
      security:
