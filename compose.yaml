name: oddkin

services:
  postgres:
    image: postgres:17.11-alpine3.24@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    environment:
      POSTGRES_USER: oddkin
      POSTGRES_PASSWORD: oddkin_local_compose_only
      POSTGRES_DB: oddkin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oddkin -d oddkin"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
      args:
        TARGET: migrate
    environment:
      DATABASE_URL: postgres://oddkin:oddkin_local_compose_only@postgres:5432/oddkin
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bootstrap:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
      args:
        TARGET: bootstrap
    environment:
      DATABASE_URL: postgres://oddkin:oddkin_local_compose_only@postgres:5432/oddkin
      ODDKIN_ADMIN_EMAIL: ${ODDKIN_ADMIN_EMAIL:-admin@oddkin.local}
      ODDKIN_ADMIN_PASSWORD: ${ODDKIN_ADMIN_PASSWORD:-oddkin-local-password}
      ODDKIN_TIMEZONE: ${ODDKIN_TIMEZONE:-America/Campo_Grande}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
      args:
        TARGET: api
    environment:
      DATABASE_URL: postgres://oddkin:oddkin_local_compose_only@postgres:5432/oddkin
      HTTP_ADDR: :8080
      INVITATION_DELIVERY_KEY: synthetic-local-invite-key-00001
      LIVEKIT_URL: ws://${ODDKIN_LIVEKIT_HOST:-127.0.0.1}:${ODDKIN_LIVEKIT_PORT:-7880}
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: oddkin-local-livekit-secret-00001
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      livekit:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
      args:
        TARGET: worker
    environment:
      DATABASE_URL: postgres://oddkin:oddkin_local_compose_only@postgres:5432/oddkin
      APP_PUBLIC_URL: ${ODDKIN_PUBLIC_URL:-http://127.0.0.1:3000}
      INVITATION_DELIVERY_KEY: synthetic-local-invite-key-00001
      RESEND_API_KEY: synthetic-local-resend-key
      RESEND_FROM_EMAIL: notices@oddkin.local
      RESEND_API_URL: http://resend:8081/emails
      LIVEKIT_URL: ws://${ODDKIN_LIVEKIT_HOST:-127.0.0.1}:${ODDKIN_LIVEKIT_PORT:-7880}
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: oddkin-local-livekit-secret-00001
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      resend:
        condition: service_started
      livekit:
        condition: service_started
    restart: unless-stopped

  resend:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
      args:
        TARGET: resend-stub
    environment:
      HTTP_ADDR: :8081
    ports:
      - "${ODDKIN_RESEND_BIND:-127.0.0.1:8025}:8081"
    restart: unless-stopped

  redis:
    image: redis:8.2.3-alpine3.22@sha256:08ad0b1d280850169a790dba1393ff7a90aef951fc19632cf4d3ce4f78e679ba
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.13.7
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "${ODDKIN_LIVEKIT_BIND:-127.0.0.1}:${ODDKIN_LIVEKIT_PORT:-7880}:7880"
      - "${ODDKIN_LIVEKIT_BIND:-127.0.0.1}:7881:7881"
      - "${ODDKIN_LIVEKIT_BIND:-127.0.0.1}:50000-50100:50000-50100/udp"
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  web:
    image: node:24.10.0-alpine3.22@sha256:775ba24d35a13e74dedce1d2af4ad510337b68d8e22be89e0ce2ccc299329083
    working_dir: /workspace
    command:
      - sh
      - -lc
      - corepack pnpm install --store-dir /pnpm/store --frozen-lockfile && corepack pnpm --filter @oddkin/web dev --host 0.0.0.0 --port 5173
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
      VITE_USE_POLLING: "true"
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/node_modules
      - web_pnpm_store:/pnpm/store
    ports:
      - "${ODDKIN_WEB_BIND:-127.0.0.1:3000}:5173"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  web_node_modules:
  web_pnpm_store:
